<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>店里电台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px 16px 40px; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 24px; margin-bottom: 6px; }
  .header .live { font-size: 13px; color: #888; }
  .header .live.on { color: #ff6b6b; }
  .now-playing { background: #16213e; border-radius: 12px; padding: 18px; margin-bottom: 16px; text-align: center; }
  .now-playing .label { font-size: 12px; color: #888; margin-bottom: 8px; }
  .now-playing .title { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
  .now-playing .meta { font-size: 13px; color: #888; }
  .progress { height: 6px; background: #333; border-radius: 3px; margin: 14px 0 6px; overflow: hidden; }
  .progress .bar { height: 100%; background: #e94560; width: 0%; transition: width 0.3s; }
  .time { font-size: 12px; color: #888; display: flex; justify-content: space-between; }
  .controls { display: flex; justify-content: center; gap: 16px; margin: 18px 0; }
  .btn { width: 64px; height: 64px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-play { background: #e94560; color: white; width: 76px; height: 76px; font-size: 30px; }
  .btn-small { background: #0f3460; color: white; font-size: 13px; width: auto; height: auto; padding: 10px 18px; border-radius: 24px; }
  .playlist { margin-top: 8px; }
  .playlist h2 { font-size: 15px; color: #888; margin-bottom: 10px; }
  .track { background: #16213e; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .track .num { color: #e94560; font-weight: bold; margin-right: 10px; min-width: 28px; }
  .track .t { flex: 1; }
  .track .d { color: #888; font-size: 12px; }
  .track.current { border: 1px solid #e94560; }
  .track.played { opacity: 0.45; }
  .skip-note { text-align: center; font-size: 12px; color: #666; margin-top: 16px; }
  audio { display: none; }
</style>
</head>
<body>
<div class="header">
  <h1>📻 店里电台</h1>
  <div class="live" id="liveLabel">每天 10:30（赫尔辛基时间）开播</div>
</div>

<div class="now-playing">
  <div class="label">正在播放</div>
  <div class="title" id="nowTitle">—</div>
  <div class="meta" id="nowMeta">—</div>
  <div class="progress"><div class="bar" id="progBar"></div></div>
  <div class="time"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>
</div>

<div class="controls">
  <button class="btn btn-small" id="btnSkip" title="跳过这一段">⏭ 跳过</button>
  <button class="btn btn-play" id="btnPlay">▶</button>
  <button class="btn btn-small" id="btnNext" title="下一段">下一段 ⏭</button>
</div>

<div class="playlist">
  <h2>节目单 · <span id="segCount"></span>段</h2>
  <div id="trackList"></div>
</div>
<div class="skip-note">点"跳过"会记下来，下次打开自动略过这段</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
// ===== 节目单（直接嵌入，不 fetch）=====
var SEGMENTS = [
  {file:"01-intro.mp3", title:"开场：店里电台试播版", dur:32},
  {file:"02-song-chunfeng.mp3", title:"蔡琴 - 春风吻上了我的脸", dur:200},
  {file:"03-song-xinlian.mp3", title:"蔡琴 - 心恋", dur:214},
  {file:"04-song-mengxingshifen.mp3", title:"梦醒时分", dur:177},
  {file:"05-song-zhongshu.mp3", title:"中暑伤风加失恋", dur:212},
  {file:"06-song-shenqi.mp3", title:"神奇", dur:226},
  {file:"07-talk-bumper1.mp3", title:"串场：B站解说节选", dur:4},
  {file:"08-talk-laodai.mp3", title:"老戴Donald - 锐评豆包手机2（节选）", dur:360},
  {file:"07-break1-umami.mp3", title:"鲜味umami小故事", dur:95},
  {file:"08-song-putongpengyou-citypop.mp3", title:"普通朋友 (City Pop版)", dur:241},
  {file:"09-song-keainuren-soul.mp3", title:"可爱女人 (Soul版)", dur:242},
  {file:"10-song-putongpengyou-funk.mp3", title:"普通朋友 (Funk版)", dur:242},
  {file:"11-song-tiankong-rb.mp3", title:"王菲《天空》R&B版", dur:269},
  {file:"14-talk-bumper2.mp3", title:"串场：B站解说节选", dur:4},
  {file:"15-talk-dianwan.mp3", title:"电丸科技AK - 睡眠实验（节选）", dur:360},
  {file:"12-break2-finland.mp3", title:"芬兰冷知识", dur:70},
  {file:"13-song-nideyanjing.mp3", title:"你的眼睛（熊天平&许茹芸 复古流行版）", dur:285},
  {file:"14-song-qingren.mp3", title:"情人（杨林 深夜R&B版）", dur:297},
  {file:"19-talk-bumper3.mp3", title:"串场：B站解说节选", dur:4},
  {file:"20-talk-xiangsheng.mp3", title:"岳云鹏 孙越 - 相声《三个臭皮匠》", dur:876},
  {file:"15-song-waterfalls.mp3", title:"TLC - Waterfalls", dur:320},
  {file:"16-song-baiwangewen.mp3", title:"陈明真 - 百万个吻", dur:266}
];
var TOTAL = 0;
SEGMENTS.forEach(function(s){ TOTAL += s.dur; });

// ===== 状态 =====
var audio = document.getElementById('audio');
var curIdx = 0;
var skipped = {};
try { skipped = JSON.parse(localStorage.getItem('radio_skipped') || '{}'); } catch(e){ skipped = {}; }

// ===== 赫尔辛基时间：每天 10:30 开播，算出直播位置 =====
function livePosition() {
  try {
    var now = new Date();
    // 赫尔辛基当前时间
    var hel = new Date(now.toLocaleString('en-US', {timeZone: 'Europe/Helsinki'}));
    var start = new Date(hel); start.setHours(10,30,0,0);
    var elapsed = Math.floor((hel - start) / 1000);
    if (elapsed < 0 || elapsed >= TOTAL) return null; // 不在播出时段
    var acc = 0;
    for (var i = 0; i < SEGMENTS.length; i++) {
      if (elapsed < acc + SEGMENTS[i].dur) return {idx: i, offset: elapsed - acc};
      acc += SEGMENTS[i].dur;
    }
    return null;
  } catch(e){ return null; }
}

function nextPlayable(from) {
  for (var i = from; i < SEGMENTS.length; i++) {
    if (!skipped[SEGMENTS[i].file]) return i;
  }
  for (var j = 0; j < from; j++) {
    if (!skipped[SEGMENTS[j].file]) return j;
  }
  return from;
}

// ===== 渲染 =====
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function renderList() {
  var html = '';
  SEGMENTS.forEach(function(s, i){
    var cls = 'track' + (i === curIdx ? ' current' : '') + (skipped[s.file] ? ' played' : '');
    html += '<div class="'+cls+'"><span class="num">'+(i+1)+'</span><span class="t">'+s.title+'</span><span class="d">'+fmt(s.dur)+'</span></div>';
  });
  document.getElementById('trackList').innerHTML = html;
  document.getElementById('segCount').textContent = SEGMENTS.length;
}
function renderNow() {
  var s = SEGMENTS[curIdx];
  document.getElementById('nowTitle').textContent = s.title;
  document.getElementById('nowMeta').textContent = '第 '+(curIdx+1)+' / '+SEGMENTS.length+' 段';
  document.getElementById('tTot').textContent = fmt(s.dur);
}

// ===== 播放控制 =====
function loadSeg(i, offset) {
  curIdx = i;
  audio.src = 'segments/' + SEGMENTS[i].file;
  audio.load();
  if (offset) {
    audio.addEventListener('loadedmetadata', function seek(){ audio.currentTime = offset; audio.removeEventListener('loadedmetadata', seek); });
  }
  renderNow(); renderList();
}
function play(){ audio.play(); }
function pause(){ audio.pause(); }

document.getElementById('btnPlay').onclick = function(){
  if (audio.paused) { play(); } else { pause(); }
};
document.getElementById('btnNext').onclick = function(){
  var n = nextPlayable(curIdx + 1);
  loadSeg(n, 0); play();
};
document.getElementById('btnSkip').onclick = function(){
  skipped[SEGMENTS[curIdx].file] = 1;
  try { localStorage.setItem('radio_skipped', JSON.stringify(skipped)); } catch(e){}
  var n = nextPlayable(curIdx + 1);
  loadSeg(n, 0); play();
};
audio.onended = function(){
  var n = nextPlayable(curIdx + 1);
  loadSeg(n, 0); play();
};
audio.onplay = function(){ document.getElementById('btnPlay').textContent = '⏸'; };
audio.onpause = function(){ document.getElementById('btnPlay').textContent = '▶'; };
audio.ontimeupdate = function(){
  if (audio.duration) {
    document.getElementById('progBar').style.width = (audio.currentTime / audio.duration * 100) + '%';
    document.getElementById('tCur').textContent = fmt(audio.currentTime);
  }
};
audio.onerror = function(){
  document.getElementById('nowTitle').textContent = '这段播不了，已跳过';
  setTimeout(function(){ document.getElementById('btnNext').onclick(); }, 1500);
};

// ===== 初始化：直播位置接入 =====
(function init(){
  var pos = livePosition();
  var startIdx = 0, offset = 0;
  if (pos) {
    startIdx = nextPlayable(pos.idx);
    // 如果直播位置那段被跳过了，从下一段可播的开始（不 seek）
    offset = (startIdx === pos.idx) ? pos.offset : 0;
    document.getElementById('liveLabel').textContent = '🔴 直播中（赫尔辛基时间）';
    document.getElementById('liveLabel').className = 'live on';
  }
  loadSeg(startIdx, offset);
})();
</script>
</body>
</html>
